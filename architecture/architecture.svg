<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 1020" width="1280" height="1020" font-family="ui-sans-serif, -apple-system, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif">
  <title>Badrgo — system architecture</title>
  <desc>API gateway fronting user, wallet and report services. TCP for synchronous calls, Kafka for domain events fed by a transactional outbox, ClickHouse for analytics, Redis for cache, rate limiting and idempotency.</desc>

  <defs>
    <marker id="sync" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0 0 L10 5 L0 10 z" fill="#0969da"/>
    </marker>
    <marker id="async" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0 0 L10 5 L0 10 z" fill="#8250df"/>
    </marker>
    <marker id="store" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0 0 L10 5 L0 10 z" fill="#57606a"/>
    </marker>
  </defs>

  <style>
    .card   { fill:#f6f8fa; stroke:#d0d7de; stroke-width:1.5; }
    .title  { font-size:17px; font-weight:650; fill:#1f2328; }
    .sub    { font-size:12.5px; fill:#57606a; }
    .mono   { font-size:12px; fill:#57606a; font-family:ui-monospace,SFMono-Regular,Menlo,Consolas,monospace; }
    .edge   { stroke:#0969da; stroke-width:2; fill:none; }
    .edgeA  { stroke:#8250df; stroke-width:2; fill:none; stroke-dasharray:7 5; }
    .edgeS  { stroke:#57606a; stroke-width:1.8; fill:none; }
    .elabel { font-size:11.5px; fill:#0969da; font-weight:600; }
    .elabelA{ font-size:11.5px; fill:#8250df; font-weight:600; }
    .elabelS{ font-size:11.5px; fill:#57606a; font-weight:600; }
  </style>

  <rect width="1280" height="1020" fill="#ffffff"/>

  <text x="48" y="56" font-size="26" font-weight="700" fill="#1f2328">Badrgo — system architecture</text>
  <text x="48" y="80" font-size="13" fill="#57606a">Each service owns its database. TCP for request/response, Kafka for domain events, ClickHouse for analytics.</text>

  <!-- ══ Next.js UI ═══════════════════════════════════════════════════════ -->
  <rect class="card" x="500" y="112" width="280" height="72" rx="12"/>
  <g transform="translate(524,128) scale(0.8333)">
    <circle cx="24" cy="24" r="21" fill="#111111"/>
    <path d="M17 34 V15 l17 20" fill="none" stroke="#ffffff" stroke-width="3.4" stroke-linecap="round" stroke-linejoin="round"/>
    <path d="M31 15 v14" fill="none" stroke="#ffffff" stroke-width="3.4" stroke-linecap="round"/>
  </g>
  <text class="title" x="582" y="146">Next.js</text>
  <text class="sub" x="582" y="165">Operations UI</text>

  <path class="edge" d="M640 184 V216" marker-end="url(#sync)"/>
  <text class="elabel" x="652" y="204">HTTPS</text>

  <!-- ══ API Gateway ══════════════════════════════════════════════════════ -->
  <rect class="card" x="360" y="218" width="560" height="96" rx="12"/>
  <g transform="translate(388,242)">
    <path d="M9 19 24 6 39 19 v20 a3 3 0 0 1 -3 3 H12 a3 3 0 0 1 -3 -3Z" fill="none" stroke="#0969da" stroke-width="3" stroke-linejoin="round"/>
    <path d="M19 42 V27 h10 v15" fill="none" stroke="#0969da" stroke-width="3" stroke-linejoin="round"/>
  </g>
  <text class="title" x="450" y="256">API Gateway · NestJS</text>
  <text class="sub" x="450" y="276">The only public process — holds no database</text>
  <text class="mono" x="450" y="296">JWT auth · rate limit · cache · Swagger · :3000</text>

  <path class="edge" d="M470 314 V352 H222 V392" marker-end="url(#sync)"/>
  <path class="edge" d="M640 314 V392" marker-end="url(#sync)"/>
  <path class="edge" d="M810 314 V352 H1058 V392" marker-end="url(#sync)"/>
  <text class="elabel" x="232" y="344">TCP</text>
  <text class="elabel" x="652" y="344">TCP</text>
  <text class="elabel" x="1024" y="344">TCP</text>

  <!-- ══ services ═════════════════════════════════════════════════════════ -->
  <rect class="card" x="72" y="394" width="300" height="104" rx="12"/>
  <g transform="translate(96,418) scale(0.875)">
    <path d="M24 3 41.5 13 v20 L24 43 6.5 33 V13Z" fill="none" stroke="#E0234E" stroke-width="3.4" stroke-linejoin="round"/>
    <path d="M17 33 V16 l14 15 V15" fill="none" stroke="#E0234E" stroke-width="3.4" stroke-linecap="round" stroke-linejoin="round"/>
  </g>
  <text class="title" x="152" y="430">User Service</text>
  <text class="sub" x="152" y="450">auth · profile · roles</text>
  <text class="mono" x="152" y="470">HTTP :3001 · TCP :4001</text>
  <text class="mono" x="96" y="490">register · login · me</text>

  <rect class="card" x="490" y="394" width="300" height="104" rx="12"/>
  <g transform="translate(514,418) scale(0.875)">
    <path d="M24 3 41.5 13 v20 L24 43 6.5 33 V13Z" fill="none" stroke="#E0234E" stroke-width="3.4" stroke-linejoin="round"/>
    <path d="M17 33 V16 l14 15 V15" fill="none" stroke="#E0234E" stroke-width="3.4" stroke-linecap="round" stroke-linejoin="round"/>
  </g>
  <text class="title" x="570" y="430">Wallet Service</text>
  <text class="sub" x="570" y="450">the only path money moves</text>
  <text class="mono" x="570" y="470">TCP :4002</text>
  <text class="mono" x="514" y="490">credit · debit · ledger · outbox</text>

  <rect class="card" x="908" y="394" width="300" height="104" rx="12"/>
  <g transform="translate(932,418) scale(0.875)">
    <path d="M24 3 41.5 13 v20 L24 43 6.5 33 V13Z" fill="none" stroke="#E0234E" stroke-width="3.4" stroke-linejoin="round"/>
    <path d="M17 33 V16 l14 15 V15" fill="none" stroke="#E0234E" stroke-width="3.4" stroke-linecap="round" stroke-linejoin="round"/>
  </g>
  <text class="title" x="988" y="430">Report Service</text>
  <text class="sub" x="988" y="450">stores, never aggregates</text>
  <text class="mono" x="988" y="470">HTTP :3003 · TCP :4003</text>
  <text class="mono" x="932" y="490">request · fetch reports</text>

  <path class="edgeS" d="M222 498 V556" marker-end="url(#store)"/>
  <path class="edgeS" d="M640 498 V556" marker-end="url(#store)"/>
  <path class="edgeS" d="M1058 498 V556" marker-end="url(#store)"/>

  <!-- ══ PostgreSQL ═══════════════════════════════════════════════════════ -->
  <g transform="translate(0,0)">
    <rect class="card" x="72" y="558" width="300" height="96" rx="12"/>
    <g transform="translate(96,580) scale(0.9167)" fill="#336791">
      <ellipse cx="24" cy="13" rx="17" ry="6.5" opacity=".72"/>
      <path d="M7 13 h34 v22 a17 6.5 0 0 1 -34 0 z"/>
      <ellipse cx="24" cy="13" rx="17" ry="6.5" fill="none" stroke="#ffffff" stroke-opacity=".6" stroke-width="1.5"/>
      <path d="M7 22 a17 6.5 0 0 0 34 0" fill="none" stroke="#ffffff" stroke-opacity=".4" stroke-width="1.5"/>
      <path d="M7 30 a17 6.5 0 0 0 34 0" fill="none" stroke="#ffffff" stroke-opacity=".3" stroke-width="1.5"/>
    </g>
    <text class="title" x="156" y="596">PostgreSQL</text>
    <text class="mono" x="156" y="614">badrgo</text>
    <text class="mono" x="96" y="640">users · roles · user_view</text>
  </g>

  <g transform="translate(418,0)">
    <rect class="card" x="72" y="558" width="300" height="96" rx="12"/>
    <g transform="translate(96,580) scale(0.9167)" fill="#336791">
      <ellipse cx="24" cy="13" rx="17" ry="6.5" opacity=".72"/>
      <path d="M7 13 h34 v22 a17 6.5 0 0 1 -34 0 z"/>
      <ellipse cx="24" cy="13" rx="17" ry="6.5" fill="none" stroke="#ffffff" stroke-opacity=".6" stroke-width="1.5"/>
      <path d="M7 22 a17 6.5 0 0 0 34 0" fill="none" stroke="#ffffff" stroke-opacity=".4" stroke-width="1.5"/>
      <path d="M7 30 a17 6.5 0 0 0 34 0" fill="none" stroke="#ffffff" stroke-opacity=".3" stroke-width="1.5"/>
    </g>
    <text class="title" x="156" y="596">PostgreSQL</text>
    <text class="mono" x="156" y="614">badrgo_wallet</text>
    <text class="mono" x="96" y="640">wallets · transactions · outbox</text>
  </g>

  <g transform="translate(836,0)">
    <rect class="card" x="72" y="558" width="300" height="96" rx="12"/>
    <g transform="translate(96,580) scale(0.9167)" fill="#336791">
      <ellipse cx="24" cy="13" rx="17" ry="6.5" opacity=".72"/>
      <path d="M7 13 h34 v22 a17 6.5 0 0 1 -34 0 z"/>
      <ellipse cx="24" cy="13" rx="17" ry="6.5" fill="none" stroke="#ffffff" stroke-opacity=".6" stroke-width="1.5"/>
      <path d="M7 22 a17 6.5 0 0 0 34 0" fill="none" stroke="#ffffff" stroke-opacity=".4" stroke-width="1.5"/>
      <path d="M7 30 a17 6.5 0 0 0 34 0" fill="none" stroke="#ffffff" stroke-opacity=".3" stroke-width="1.5"/>
    </g>
    <text class="title" x="156" y="596">PostgreSQL</text>
    <text class="mono" x="156" y="614">badrgo_report</text>
    <text class="mono" x="96" y="640">reports · report_view</text>
  </g>

  <path class="edgeA" d="M640 654 V706" marker-end="url(#async)"/>
  <text class="elabelA" x="652" y="684">outbox drain</text>

  <!-- ══ Kafka ════════════════════════════════════════════════════════════ -->
  <rect class="card" x="490" y="708" width="300" height="112" rx="12"/>
  <g transform="translate(514,732) scale(0.9167)">
    <g stroke="#231F20" stroke-width="2.6" fill="none">
      <path d="M24 12 v24"/><path d="M24 20 L34 13"/><path d="M24 28 L34 35"/>
    </g>
    <g fill="#231F20">
      <circle cx="24" cy="9" r="4.4"/><circle cx="24" cy="39" r="4.4"/>
      <circle cx="36" cy="11" r="4.4"/><circle cx="36" cy="37" r="4.4"/>
      <circle cx="24" cy="24" r="3.4"/>
    </g>
  </g>
  <text class="title" x="574" y="746">Apache Kafka</text>
  <text class="sub" x="574" y="765">KRaft · single node</text>
  <text class="mono" x="514" y="788">wallet.created · wallet.credited</text>
  <text class="mono" x="514" y="806">wallet.debited · tx.posted</text>

  <path class="edgeA" d="M790 758 H1058 V866" marker-end="url(#async)"/>
  <text class="elabelA" x="806" y="748">Kafka engine table · no consumer</text>

  <!-- ══ ClickHouse ═══════════════════════════════════════════════════════ -->
  <rect class="card" x="908" y="868" width="300" height="104" rx="12"/>
  <g transform="translate(932,892) scale(0.9167)">
    <rect x="5" y="7" width="7" height="34" rx="1" fill="#FFCC00"/>
    <rect x="15" y="7" width="7" height="34" rx="1" fill="#FFCC00"/>
    <rect x="25" y="7" width="7" height="34" rx="1" fill="#FFCC00"/>
    <rect x="35" y="7" width="7" height="34" rx="1" fill="#FFCC00"/>
    <rect x="35" y="20" width="7" height="8" rx="1" fill="#1A1A1A"/>
  </g>
  <text class="title" x="992" y="906">ClickHouse</text>
  <text class="sub" x="992" y="925">analytics store</text>
  <text class="mono" x="932" y="948">wallet_events → balance view</text>
  <text class="mono" x="932" y="964">wallet_report_view (aggregate)</text>

  <path class="edgeA" d="M1208 920 H1244 V446 H1208" marker-end="url(#async)"/>
  <text class="elabelA" x="1236" y="706" text-anchor="end">reads aggregates</text>

  <!-- ══ Redis ════════════════════════════════════════════════════════════ -->
  <rect class="card" x="72" y="708" width="300" height="104" rx="12"/>
  <g transform="translate(96,732) scale(0.9167)">
    <path d="M24 4 44 12 24 20 4 12Z" fill="#DC382D"/>
    <path d="M4 17 24 25 44 17 44 23 24 31 4 23Z" fill="#DC382D" opacity=".82"/>
    <path d="M4 28 24 36 44 28 44 34 24 42 4 34Z" fill="#DC382D" opacity=".64"/>
  </g>
  <text class="title" x="156" y="748">Redis</text>
  <text class="sub" x="156" y="767">not durable — reservations</text>
  <text class="mono" x="96" y="792">cache · rate limit · idempotency</text>

  <path class="edgeS" d="M72 760 H36 V266 H360" marker-start="url(#store)" marker-end="url(#store)"/>
  <text class="elabelS" transform="translate(24,520) rotate(-90)" text-anchor="middle">cache · rate limit</text>

  <path class="edgeS" d="M372 760 H440 V446 H490" marker-start="url(#store)" marker-end="url(#store)"/>
  <text class="elabelS" transform="translate(430,600) rotate(-90)" text-anchor="middle">idempotency</text>

  <!-- ══ legend ═══════════════════════════════════════════════════════════ -->
  <rect class="card" x="72" y="868" width="760" height="104" rx="12"/>
  <text class="title" x="96" y="898">Legend</text>

  <path class="edge" d="M96 922 H152" marker-end="url(#sync)"/>
  <text class="mono" x="162" y="926">synchronous request/response over Nest TCP</text>

  <path class="edgeA" d="M96 950 H152" marker-end="url(#async)"/>
  <text class="mono" x="162" y="954">asynchronous — outbox, then Kafka</text>

  <path class="edgeS" d="M520 922 H576" marker-end="url(#store)"/>
  <text class="mono" x="586" y="926">datastore access</text>
  <text class="mono" x="520" y="954">money: numeric(20,8) end to end</text>
</svg>
